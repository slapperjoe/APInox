name: Build Tauri App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_arch:
        description: 'Build Arch Linux'
        type: boolean
        default: false
        

env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            rust_target: x86_64-pc-windows-msvc
            artifact_name: windows-x64
          - platform: macos-latest
            target: aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
            artifact_name: macos-arm64
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            rust_target: x86_64-unknown-linux-gnu
            artifact_name: linux-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Ensure cargo is available (macOS)
        if: runner.os == 'macOS'
        run: rustup default stable && cargo --version

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - name: Install dependencies (macOS only)
        if: matrix.platform == 'macos-latest'
        run: brew install create-dmg

      - name: Install root dependencies
        run: npm ci

      - name: Install webview dependencies
        run: cd src-tauri/webview && npm ci

      - name: Build Tauri app
        run: npm run tauri:build -- --target ${{ matrix.target }}
        env:
          # Increase Node heap on macOS to prevent intermittent Vite/Node OOM during beforeBuildCommand
          NODE_OPTIONS: ${{ matrix.platform == 'macos-latest' && '--max-old-space-size=8192' || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Stage desktop build artifacts
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $releaseDir = "target/${{ matrix.target }}/release/release-assets"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null

          if ("${{ matrix.platform }}" -eq "windows-latest") {
            $setup = Get-ChildItem -Path "target/${{ matrix.target }}/release/bundle/nsis/*.exe" -File -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($setup) {
              Copy-Item $setup.FullName (Join-Path $releaseDir "apinox-v$version-windows-x64-setup.exe")
            }
          }

          if ("${{ matrix.platform }}" -eq "macos-latest") {
            $dmg = Get-ChildItem -Path "target/${{ matrix.target }}/release/bundle/dmg/*.dmg" -File -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($dmg) {
              Copy-Item $dmg.FullName (Join-Path $releaseDir "apinox-v$version-macos-arm64.dmg")
            }
          }

          if ("${{ matrix.platform }}" -eq "ubuntu-latest") {
            $deb = Get-ChildItem -Path "target/${{ matrix.target }}/release/bundle/deb/*.deb" -File -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($deb) {
              Copy-Item $deb.FullName (Join-Path $releaseDir "apinox-v$version-linux-x64.deb")
            }

            $rpm = Get-ChildItem -Path "target/${{ matrix.target }}/release/bundle/rpm/*.rpm" -File -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($rpm) {
              Copy-Item $rpm.FullName (Join-Path $releaseDir "apinox-v$version-linux-x64.rpm")
            }
          }

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apinox-${{ matrix.artifact_name }}
          path: target/${{ matrix.target }}/release/release-assets/*
          if-no-files-found: error

  build-arch:
    if: inputs.build_arch == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: archlinux/archlinux:latest

    steps:
      - name: Install git (required for checkout in Arch container)
        run: pacman -Sy --noconfirm git

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update system and install build dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm \
            base-devel \
            nodejs \
            npm \
            rust \
            webkit2gtk-4.1 \
            gtk3 \
            libsoup3 \
            openssl \
            patchelf \
            dpkg \
            rpm-tools

      - name: Install root Node.js dependencies
        run: npm ci

      - name: Install webview Node.js dependencies
        run: cd src-tauri/webview && npm ci

      - name: Pre-build steps
        run: |
          node scripts/version.js increment
          node scripts/version.js sync
          npm run build:packages

      - name: Build Tauri app
        run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Package for Arch Linux
        run: |
          # makepkg cannot run as root; create a temporary build user
          useradd -m builder
          WORKDIR="$(pwd)"
          chown -R builder:builder "$WORKDIR"
          # Write a helper script so the workspace path is not interpolated
          # inside a shell string passed to su, avoiding potential quoting issues
          cat > /tmp/run-makepkg.sh << SCRIPT
          #!/bin/bash
          set -e
          cd "$WORKDIR"
          mkdir -p target/release/bundle/arch
          # --nodeps: dependencies already installed in the previous step
          # --nocheck: the PKGBUILD has no check() function
          PKGDEST="$WORKDIR/target/release/bundle/arch" makepkg -f --nodeps --nocheck --noconfirm
          SCRIPT
          chmod +x /tmp/run-makepkg.sh
          su -s /bin/bash builder /tmp/run-makepkg.sh
          node scripts/gen-arch-install.js

      - name: Upload Arch Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apinox-linux-archlinux-x86_64
          path: target/release/bundle/arch/release-assets/*
          if-no-files-found: error
