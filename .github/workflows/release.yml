name: Release

# Manually triggered from the GitHub Actions UI.
#
# This workflow does NOT rebuild the app. It reuses the installers produced by
# the most recent successful "Build Tauri App" run (build.yml) on main *for the
# exact commit that is currently HEAD*, and publishes them as a GitHub Release.
#
# Why the version is adopted from the artifacts:
#   The app version is compiled into the binaries (Rust reads it via build.rs ->
#   APINOX_APP_VERSION, the webview bakes __APP_VERSION__) and into the bundle
#   filenames at build time. A *different* number can therefore only be obtained
#   by building again — so the push build is the ground truth and this workflow
#   adopts the number it already produced, then commits it back to keep the tree
#   in sync. To change the minor (or major), bump it in package.json and push
#   (or run `npm run version-bump-minor`) before building.
#
# Including Arch Linux packages:
#   Dispatch "Build Tauri App" with `build_arch = true` for the commit you want
#   to release; the Arch packages ride along in that run and are picked up here
#   automatically.
#
# Requirements:
#   - A successful build.yml run on main whose headSha == HEAD.
#   - GITHUB_TOKEN is provided automatically by GitHub Actions.
on:
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Locate the successful build for HEAD
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          HEAD_SHA=$(git rev-parse HEAD)
          echo "HEAD: $HEAD_SHA"

          RUNS=$(gh run list \
            --workflow build.yml \
            --branch main \
            --status success \
            --limit 50 \
            --json databaseId,headSha)

          RUN_ID=$(echo "$RUNS" \
            | jq -r --arg sha "$HEAD_SHA" '[.[] | select(.headSha == $sha)] | .[0].databaseId // empty')

          if [ -z "$RUN_ID" ]; then
            echo "❌ No successful Build Tauri App run found for HEAD ($HEAD_SHA)."
            echo "   Wait for the build of the current commit to finish, then retry."
            exit 1
          fi

          echo "Using build run: $RUN_ID"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download artifacts from that build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf artifacts
          gh run download "${{ steps.build.outputs.run_id }}" --dir artifacts
          echo "Downloaded:"
          find artifacts -type f | sort

      - name: Determine version from the built installers
        id: version
        run: |
          set -euo pipefail
          # Installer filenames carry the version baked in at build time,
          # e.g. apinox-v0.56.394-linux-x64.deb / -archlinux-x86_64.pkg.tar.zst
          VERSIONS=$(find artifacts -type f \
            | grep -oE 'apinox-v[0-9]+\.[0-9]+\.[0-9]+' \
            | sed 's/^apinox-v//' \
            | sort -u)

          if [ -z "$VERSIONS" ]; then
            echo "❌ Could not determine a version from the downloaded artifacts."
            exit 1
          fi

          COUNT=$(echo "$VERSIONS" | wc -l | tr -d ' ')
          if [ "$COUNT" != "1" ]; then
            echo "❌ Artifacts contain more than one version:"
            echo "$VERSIONS"
            exit 1
          fi

          echo "Version from artifacts: $VERSIONS"
          echo "version=$VERSIONS" >> "$GITHUB_OUTPUT"

      - name: Refuse if the tag already exists
        run: |
          set -euo pipefail
          TAG="v${{ steps.version.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "❌ Tag $TAG already exists. Bump the version and push a new build before releasing."
            exit 1
          fi

      - name: Adopt that version (BUILD_NO + synced config files)
        run: node scripts/version.js set "${{ steps.version.outputs.version }}"

      - name: Commit version bump
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/version.js package.json src-tauri/tauri.conf.json
          if git diff --cached --quiet; then
            echo "Nothing to commit — tree already at v${{ steps.version.outputs.version }}."
          else
            # [skip ci] is load-bearing: without it this push would trigger
            # another full build.yml run for a commit nobody will ever release.
            git commit -m "chore: bump version to v${{ steps.version.outputs.version }} [skip ci]"
            git push origin HEAD:main
          fi

      - name: Create and push version tag
        run: |
          set -euo pipefail
          TAG="v${{ steps.version.outputs.version }}"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Build changelog from commits since last tag
        id: changelog
        run: |
          set -euo pipefail
          VERSION="v${{ steps.version.outputs.version }}"
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${VERSION}$" | head -1 || true)
          if [ -z "$PREV_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREV_TAG}..HEAD"
          fi
          echo "Changelog range: ${PREV_TAG:-<beginning>} → HEAD"

          COMMITS=$(git log "$RANGE" \
            --no-merges \
            --pretty=format:"- %s ([%h](../../commit/%H))" \
            | grep -Ev "^- (chore: bump version|chore: release|Merge branch|update Cargo\.lock)" \
            || true)

          if [ -z "$COMMITS" ]; then
            COMMITS="_No user-facing changes since ${PREV_TAG:-the beginning}._"
          fi

          {
            echo "## What's changed"
            echo ""
            echo "$COMMITS"
            if [ -n "$PREV_TAG" ]; then
              echo ""
              echo "**Full diff**: [$PREV_TAG → $VERSION](../../compare/${PREV_TAG}...${VERSION})"
            fi
          } > changelog.md

          cat changelog.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: APInox v${{ steps.version.outputs.version }}
          draft: true
          body_path: changelog.md
          files: |
            artifacts/**/apinox-v*
            artifacts/**/APInox-portable.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
